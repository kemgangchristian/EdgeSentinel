# *******************************************************
# infra/jenkins/docker-compose.yml — Jenkins conteneurisé
# Séparé de la plateforme applicative : Jenkins orchestre les déploiements.
# *******************************************************

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: edgesentinel-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

volumes:
  jenkins_home: