spring.application.name=EdgeSentinel-Backend
# Port dédié pour éviter le conflit avec Jenkins (8080)
server.port=8081
# Configuration MQTT — cohérente avec edge/config/config.yaml
mqtt.broker.url=tcp://localhost:1883
mqtt.broker.clientId=edgesentinel-backend
mqtt.topic=edge/+/events
# Connexion PostgreSQL — credentials Dev (voir infra/dev/docker-compose.override.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/edgesentinel
spring.datasource.username=edgesentinel
spring.datasource.password=edgesentinel_dev_password
# ddl-auto=update : Hibernate crée/met à jour automatiquement les tables
# depuis les entités JPA -- pratique en Dev, jamais en Prod (migrations
# versionnées, ex: Flyway, à ce moment-là).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true