# *******************************************************
# Configuration de l'agent Edge — EdgeSentinel
# *******************************************************

device:
  # Identifiant unique de ce Raspberry Pi, de connexion MQTT et de clé primaire côté backend.
  id: "PI-001"

camera:
  # Source vidéo : 0 = première webcam du système raspberry Pi ou un chemin (/dev/video0) ou une URL RTSP (caméra IP).
  source: 0
  # Résolution demandée à la caméra (limite la charge de calcul de l'IA).
  width: 640
  height: 480
  # FPS cible de lecture, pour ne pas saturer le CPU du Raspberry Pi.
  target_fps: 15

detector:
  # Modèle YOLOv8 (Ultralytics). "yolov8n.pt" 
  model_path: "yolov8n.pt"
  # Seuil de confiance minimum (0.0 à 1.0) pour garder une détection.
  confidence_threshold: 0.5
  # Classes COCO à surveiller. 0 = "person". Liste vide = tout détecter.
  classes_of_interest: [0]

tracker:
  # Augmenté de 75 -> 150 : à faible FPS (5-8 sur CPU sans GPU), le délai
  # entre deux frames est plus long, donc un mouvement normal peut
  # facilement dépasser 75px et casser l'appariement (observé en usage
  # réel : track_id incrémentant à chaque frame au lieu de rester stable).
  max_match_distance: 150
  # Augmenté de 15 -> 30 : tolère une occlusion plus longue, cohérent avec
  # le FPS réduit (30 frames à 6 FPS = 5 secondes de tolérance, raisonnable).
  max_frames_missing: 30

event_engine:
  # Zones interdites, définies en polygones (coordonnées en pixels).
  zones:
    - name: "ZONE_A"
      polygon:
        - [50, 50]
        - [300, 50]
        - [300, 300]
        - [50, 300]
  # Si vrai, un même objet suivi ne génère un nouvel événement qu'au moment où son état change (ex: entrée en zone).
  deduplicate_events: true

sinks:
  # Pour publier les événements "mqtt" 
  console:
    enabled: true
  file:
    enabled: true
    path: "events.jsonl"

logging:
  level: "INFO"
